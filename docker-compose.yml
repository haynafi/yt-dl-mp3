services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      PORT: 3000
      TRUST_PROXY: 1
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
